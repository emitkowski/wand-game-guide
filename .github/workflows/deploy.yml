name: Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Matches local/test convention exactly: phpunit.xml pins DB_CONNECTION=sqlite,
      # DB_DATABASE=:memory:, and RefreshDatabase migrates per test class — no
      # separate DB service container or migrate step needed (see BUG-2 in
      # docs/BUGS_ARCHIVE.md for why this replaced a MySQL service that CI alone used).
      # A built Vite manifest (public/build/manifest.json) is required before this step —
      # any test rendering an Inertia page (login, dashboard, Game Guide) throws
      # ViteManifestNotFoundException otherwise, since app.blade.php's @vite directive
      # needs a real manifest to resolve asset paths.
      - name: Run tests
        run: php artisan test --compact

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan optimize:clear
            npm ci
            php artisan wayfinder:generate --with-form
            npm run build
            php artisan migrate --force
            php artisan storage:link
            php artisan optimize
